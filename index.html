<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Крестики-нолики</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="game-card">
        <p class="eyebrow">Browser Edition</p>
        <h1>Крестики-нолики</h1>
        <p class="subtitle">
          Матч идет до трех побед. Ничья не приносит очков и сразу запускает новый раунд.
        </p>

        <section class="scoreboard" aria-label="Счет матча">
          <div class="score-box">
            <span class="score-label">Игрок X</span>
            <strong id="score-x">0</strong>
          </div>
          <div class="score-box">
            <span class="score-label">Игрок O</span>
            <strong id="score-o">0</strong>
          </div>
        </section>

        <p id="status" class="status">Ход игрока X</p>

        <section class="board" id="board" aria-label="Игровое поле"></section>

        <div class="actions">
          <button id="reset-round" type="button">Сбросить раунд</button>
          <button id="reset-match" type="button" class="secondary">Сбросить матч</button>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
